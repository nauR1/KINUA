name: Validate Biometria
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: biometria_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test -d biometria_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 libportaudio2
      - run: python -m pytest -q
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test:test-only-password@127.0.0.1:5432/biometria_test
      - run: python -m alembic upgrade head && python -m alembic check && python -m alembic downgrade base && python -m alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://test:test-only-password@127.0.0.1:5432/biometria_test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run prepare:vision && npm run typecheck && npm test && npm run build
        working-directory: frontend
